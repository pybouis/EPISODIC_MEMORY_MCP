[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "episodic-memory-mcp"
version = "0.1.0"
description = "Serveur MCP de mémoire épisodique : questions/réponses validées, retrouvées par similarité vectorielle"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
episodic-memory-mcp = "episodic_memory.server:main"
episodic-memory = "episodic_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pas de .pytest_cache : OneDrive verrouille le dossier et provoque des avertissements.
addopts = "-p no:cacheprovider"
